<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hub</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; color: #111; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, select { width: 100%; padding: 10px; margin-top: 4px; font-size: 16px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; margin-top: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; }
  button.alt { background: #64748b; }
  .box { margin-top: 16px; padding: 24px 16px; border-radius: 10px; background: #f1f5f9; font-size: 20px; text-align: center; }
  .hint { font-size: 13px; color: #555; margin-top: 4px; word-break: break-all; }
  .check { font-weight: normal; display: flex; align-items: center; gap: 8px; }
  .check input { width: auto; margin: 0; }
</style>
</head>
<body>

<!-- 1. Guest taps card: link is https://.../?t=TOKEN -->
<div id="tap" hidden>
  <h2>Study Hub</h2>
  <div class="box" id="tapResult">Recording...</div>
</div>

<!-- 2. Staff: make NFC card: link is https://.../?admin=1 -->
<div id="cards" hidden>
  <h2>Make NFC Card</h2>
  <label>Guest name <input id="cardName"></label>
  <button type="button" id="mkToken">Create card</button>
  <div class="box" id="cardResult" hidden>
    <div>Token: <b id="cardToken"></b></div>
    <div class="hint" id="cardUrl"></div>
  </div>
  <p class="hint">Write the link above onto the NFC tag with NFC Tools (Write &gt; Add a record &gt; URL).</p>
</div>

<!-- 3. Staff: booking form (no NFC fields) -->
<div id="booking" hidden>
  <h2>Study Hub Booking</h2>
  <form id="form">
    <label>Name <input id="name" required></label>
    <label>Date <input type="date" id="date" required></label>
    <label>Purpose <input id="purpose"></label>

    <label>Time In <input type="time" id="timeIn"></label>
    <label class="check"><input type="checkbox" id="openTime"> Open time</label>

    <label>Category <select id="category"></select></label>
    <div class="hint" id="groupHint"></div>

    <label>Group Size <input type="number" id="groupSize" min="1" value="1"></label>
    <label>Personnel in charge <select id="personnel"></select></label>

    <button type="submit">Save Booking</button>
  </form>
  <p id="msg"></p>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzlzbiuTATPOKUXBTQubIVFvLIgiHbWeUeZXTaUEgXV8NgiZb1JxZKf0HACJ4--dHHomA/exec';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get('t');

async function post(body) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

// ---- Mode 1: guest tap ----
if (token) {
  $('tap').hidden = false;
  post({ action: 'tap', token }).then(r => {
    if (!r.ok) $('tapResult').textContent = 'Error: ' + r.error;
    else if (r.action === 'in') $('tapResult').textContent = 'Checked IN at ' + r.time;
    else $('tapResult').textContent = 'Checked OUT at ' + r.time + ' | ' + r.hours + ' hr | ₱' + r.total;
  }).catch(() => { $('tapResult').textContent = 'Network error. Please tap again.'; });

// ---- Mode 2: staff makes a card ----
} else if (params.get('admin') === '1') {
  $('cards').hidden = false;
  $('mkToken').onclick = async () => {
    const name = $('cardName').value.trim();
    if (!name) return alert('Enter the guest name first');
    const r = await post({ action: 'newToken', name });
    if (!r.ok) return alert(r.error);
    $('cardToken').textContent = r.token;
    $('cardUrl').textContent = r.url;
    $('cardResult').hidden = false;
    $('cardName').value = '';
  };

// ---- Mode 3: staff booking form ----
} else {
  $('booking').hidden = false;
  loadConfig();
}

async function loadConfig() {
  const r = await (await fetch(API_URL)).json();
  $('category').innerHTML = r.categories
    .map(c => `<option value="${c.name}" data-g="${c.groupSize}">${c.name} (₱${c.rate}/hr)</option>`)
    .join('');
  $('personnel').innerHTML = r.personnel.map(p => `<option>${p}</option>`).join('');
  showGroupHint();
}

function showGroupHint() {
  const opt = $('category').selectedOptions[0];
  $('groupHint').textContent = opt ? 'Suggested group size: ' + opt.dataset.g : '';
}
$('category').onchange = showGroupHint;

$('openTime').onchange = e => { $('timeIn').disabled = e.target.checked; };

$('form').onsubmit = async e => {
  e.preventDefault();
  const r = await post({
    action: 'visit',
    name: $('name').value,
    date: $('date').value,
    purpose: $('purpose').value,
    timeIn: $('openTime').checked ? 'Open' : $('timeIn').value,
    category: $('category').value,
    groupSize: $('groupSize').value,
    personnel: $('personnel').value
  });
  $('msg').textContent = r.ok ? 'Booking saved!' : 'Error: ' + r.error;
  if (r.ok) {
    e.target.reset();
    $('timeIn').disabled = false;
    showGroupHint();
  }
};
</script>
</body>
</html>
