<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hub</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; color: #111; }
  h2 { margin-bottom: 8px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input, select { width: 100%; padding: 10px; margin-top: 4px; font-size: 16px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; margin-top: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  button.alt { background: #64748b; }
  .box { margin-top: 16px; padding: 24px 16px; border-radius: 10px; background: #f1f5f9; font-size: 20px; text-align: center; }
  .error { margin-top: 16px; padding: 16px; border-radius: 10px; background: #fee2e2; color: #991b1b; font-size: 16px; }
  .hint { font-size: 13px; color: #555; margin-top: 4px; word-break: break-all; }
  .check { font-weight: normal; display: flex; align-items: center; gap: 8px; }
  .check input { width: auto; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h2>Study Hub</h2>

<div id="loading" class="box">Loading Study Hub...</div>
<div id="error" class="error" hidden></div>

<!-- Guest taps the NFC card (?t=TOKEN) -->
<div id="tap" hidden>
  <div class="box" id="tapResult">Recording...</div>

  <div id="walkin" hidden>
    <label>Category <select id="wCategory"></select></label>
    <label>Number of people <input type="number" id="wGroup" min="1"></label>
    <button type="button" id="wStart">Check in</button>
  </div>
</div>

<!-- Staff makes an NFC card (?admin=1) -->
<div id="cards" hidden>
  <h3>Make NFC Card</h3>
  <label>Guest name <input id="cardName"></label>
  <button type="button" id="mkToken">Create card</button>
  <div class="box" id="cardResult" hidden>
    <div>Token: <b id="cardToken"></b></div>
    <div class="hint" id="cardUrl"></div>
  </div>
  <p class="hint">Write the link above onto the NFC tag with NFC Tools (Write &gt; Add a record &gt; URL).</p>
</div>

<!-- Staff booking form (plain link) -->
<div id="booking" hidden>
  <h3>Booking</h3>
  <form id="form">
    <label>Name <input id="name" required></label>
    <label>Date <input type="date" id="date" required></label>
    <label>Purpose <input id="purpose"></label>

    <label>Time In <input type="time" id="timeIn"></label>
    <label class="check"><input type="checkbox" id="openTime"> Open time</label>
    <label>Time Out (if already left) <input type="time" id="timeOut"></label>

    <label>Category <select id="category"></select></label>
    <label>Number of people <input type="number" id="groupSize" min="1"></label>

    <button type="submit" id="save">Save Booking</button>
  </form>
  <p id="msg"></p>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzlzbiuTATPOKUXBTQubIVFvLIgiHbWeUeZXTaUEgXV8NgiZb1JxZKf0HACJ4--dHHomA/exec';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get('t');
const mode = token ? 'tap' : (params.get('admin') === '1' ? 'admin' : 'booking');
let cats = [];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function show(id) {
  ['tap', 'cards', 'booking'].forEach(v => { $(v).hidden = v !== id; });
  $('loading').hidden = true;
}

function fail(msg) {
  $('loading').hidden = true;
  $('error').hidden = false;
  $('error').textContent = 'Error: ' + msg;
}

async function post(body) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

// Loads the Settings table. Each row becomes one choice, e.g. "The Huddle, 6 people, ₱30/hr"
async function loadConfig() {
  const r = await (await fetch(API_URL)).json();
  if (!r.ok) throw new Error(r.error || 'Could not load settings');

  cats = r.categories;
  const catOptions = cats.map((c, i) =>
    `<option value="${i}">${esc(c.name)}, ${esc(c.groupSize)} people, ₱${esc(c.rate)}/hr</option>`).join('');

  $('category').innerHTML = catOptions;
  $('wCategory').innerHTML = catOptions;
  syncGroupSize();
}

// When a choice is picked, fill in its group size (staff can still change it)
function syncGroupSize() {
  const a = cats[$('category').value];
  const b = cats[$('wCategory').value];
  if (a) $('groupSize').value = a.groupSize;
  if (b) $('wGroup').value = b.groupSize;
}

// ---- Guest tap ----
async function runTap() {
  show('tap');
  const r = await post({ action: 'tap', token });

  if (!r.ok) {
    $('tapResult').textContent = 'Error: ' + r.error;
  } else if (r.action === 'choose') {
    $('tapResult').textContent = 'Welcome ' + r.name + '. Choose your room to check in.';
    await loadConfig();
    $('walkin').hidden = false;
  } else if (r.action === 'in') {
    $('tapResult').textContent = 'Checked IN at ' + r.time;
  } else {
    $('tapResult').textContent = 'Checked OUT at ' + r.time + ' | ' + r.hours + ' hr | ₱' + r.total;
  }
}

$('wStart').onclick = async () => {
  const btn = $('wStart');
  const c = cats[$('wCategory').value];
  btn.disabled = true;
  try {
    const r = await post({
      action: 'walkin',
      token,
      category: c.name,
      groupSize: $('wGroup').value
    });
    if (!r.ok) throw new Error(r.error);
    $('walkin').hidden = true;
    $('tapResult').textContent = 'Checked IN at ' + r.time + ' | ' + c.name;
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false;
  }
};

// ---- Staff: make NFC card ----
$('mkToken').onclick = async () => {
  const name = $('cardName').value.trim();
  if (!name) return alert('Enter the guest name first');
  try {
    const r = await post({ action: 'newToken', name });
    if (!r.ok) throw new Error(r.error);
    $('cardToken').textContent = r.token;
    $('cardUrl').textContent = r.url;
    $('cardResult').hidden = false;
    $('cardName').value = '';
  } catch (e) {
    alert(e.message);
  }
};

// ---- Staff: booking form ----
$('openTime').onchange = e => { $('timeIn').disabled = e.target.checked; };
$('category').onchange = syncGroupSize;
$('wCategory').onchange = syncGroupSize;

$('form').onsubmit = async e => {
  e.preventDefault();
  const btn = $('save');
  const c = cats[$('category').value];
  btn.disabled = true;
  try {
    const r = await post({
      action: 'visit',
      name: $('name').value,
      date: $('date').value,
      purpose: $('purpose').value,
      timeIn: $('openTime').checked ? 'Open' : $('timeIn').value,
      timeOut: $('timeOut').value,
      category: c.name,
      groupSize: $('groupSize').value
    });
    if (!r.ok) throw new Error(r.error);
    $('msg').textContent = 'Booking saved!';
    e.target.reset();
    $('timeIn').disabled = false;
    syncGroupSize();
  } catch (err) {
    $('msg').textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
};

// ---- Start ----
async function init() {
  if (mode === 'tap') return runTap();
  if (mode === 'admin') return show('cards');
  show('booking');
  await loadConfig();
}

init().catch(e => fail(e.message));
</script>
</body>
</html>
