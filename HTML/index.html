<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCKDIN Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --olive: #4B5340;
    --olive-2: #6B7356;
    --mint: #F1FFE6;
    --yellow: #FFDD57;
    --line: #D5DCC5;
    --band: #F6FBEF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', system-ui, sans-serif;
    background: var(--mint);
    color: var(--olive);
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 32px; }

  header { text-align: center; padding: 8px 0 4px; }
  header .mark { width: 88px; mix-blend-mode: multiply; }
  header .word { width: 250px; max-width: 80%; mix-blend-mode: multiply; margin-top: 4px; }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 2px 10px rgba(75, 83, 64, 0.08);
  }
  .title { font-size: 18px; font-weight: 700; margin: 0 0 8px; text-align: center; }
  .subtitle { font-size: 13px; color: var(--olive-2); text-align: center; margin: 0 0 12px; }

  label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
  input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-size: 16px;
    font-family: inherit;
    color: #111;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  input:focus, select:focus { outline: 2px solid var(--yellow); border-color: var(--olive); }
  input:disabled { background: #f3f4f0; }

  .check { display: flex; align-items: center; gap: 8px; font-weight: 400; margin-top: 12px; }
  .check input { width: auto; margin: 0; }

  button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    color: var(--olive);
    background: var(--yellow);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.97); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.dark { background: var(--olive); color: #fff; }

  .status {
    text-align: center;
    padding: 28px 16px;
    border-radius: 14px;
    font-size: 19px;
    font-weight: 600;
    background: var(--band);
    border: 1px solid var(--line);
  }
  .status.in { background: #CDEFC2; }
  .status.out { background: #E3E6DC; }
  .status.err { background: #fee2e2; color: #991b1b; border-color: #fca5a5; font-size: 16px; }

  .divider { height: 1px; background: var(--line); margin: 18px 0 4px; }
  .hint { font-size: 12px; color: var(--olive-2); margin-top: 8px; word-break: break-all; line-height: 1.5; }
  .msg { margin-top: 12px; text-align: center; font-weight: 600; }
  .msg.ok { color: #3f6212; }
  .msg.err { color: #991b1b; }

  .loading { text-align: center; color: var(--olive-2); padding: 30px 0; }
  footer { text-align: center; font-size: 12px; color: var(--olive-2); margin-top: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="mark" src="logo-mark.png.jpg" alt="LCKDIN logo">
    <br>
    <img class="word" src="logo-wordmark.png.jpg" alt="LCKDIN Study Hub">
  </header>

  <div id="loading" class="card loading">Loading...</div>
  <div id="error" class="status err" hidden></div>

  <!-- Guest taps the NFC card (?t=TOKEN) -->
  <div id="tap" class="card" hidden>
    <div id="tapResult" class="status">Recording...</div>

    <div id="walkin" hidden>
      <div class="divider"></div>
      <p class="subtitle">Choose your room and purpose to check in</p>
      <label>Room
        <select id="wCategory"></select>
      </label>
      <label>Purpose
        <select id="wPurpose">
          <option value="School">School</option>
          <option value="Work">Work</option>
        </select>
      </label>
      <label>Number of people
        <input type="number" id="wGroup" min="1">
      </label>
      <button type="button" id="wStart">Check in</button>
    </div>
  </div>

  <!-- Staff makes an NFC card (?admin=1) -->
  <div id="cards" class="card" hidden>
    <h3 class="title">Make NFC Card</h3>
    <label>Guest name
      <input id="cardName">
    </label>
    <button type="button" id="mkToken" class="dark">Create card</button>
    <div class="status" id="cardResult" hidden style="margin-top:16px;text-align:left;font-size:15px">
      <div>Token: <b id="cardToken"></b></div>
      <div class="hint" id="cardUrl"></div>
    </div>
    <p class="hint">Write the link above onto the NFC tag with NFC Tools (Write &gt; Add a record &gt; URL).</p>
  </div>

  <!-- Staff booking form (plain link) -->
  <div id="booking" class="card" hidden>
    <h3 class="title">Booking</h3>
    <p class="subtitle">Save a guest's visit to the Study Hub sheet</p>
    <form id="form">
      <label>Name
        <input id="name" required>
      </label>
      <label>Date
        <input type="date" id="date" required>
      </label>
      <label>Purpose
        <select id="purpose">
          <option value="School">School</option>
          <option value="Work">Work</option>
        </select>
      </label>

      <label>Time In
        <input type="time" id="timeIn">
      </label>
      <label class="check">
        <input type="checkbox" id="openTime"> Open time
      </label>
      <label>Time Out (if already left)
        <input type="time" id="timeOut">
      </label>

      <label>Room
        <select id="category"></select>
      </label>
      <label>Number of people
        <input type="number" id="groupSize" min="1">
      </label>

      <button type="submit" id="save">Save Booking</button>
    </form>
    <p id="msg" class="msg"></p>
  </div>

  <footer>LCKDIN Study Hub</footer>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzlzbiuTATPOKUXBTQubIVFvLIgiHbWeUeZXTaUEgXV8NgiZb1JxZKf0HACJ4--dHHomA/exec';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get('t');
const mode = token ? 'tap' : (params.get('admin') === '1' ? 'admin' : 'booking');
let cats = [];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function show(id) {
  ['tap', 'cards', 'booking'].forEach(v => { $(v).hidden = v !== id; });
  $('loading').hidden = true;
}

function fail(msg) {
  $('loading').hidden = true;
  $('error').hidden = false;
  $('error').textContent = 'Error: ' + msg;
}

function setStatus(el, text, kind) {
  el.className = 'status' + (kind ? ' ' + kind : '');
  el.textContent = text;
}

async function post(body) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

// Loads the Settings table. Each row becomes one choice, e.g. "The Huddle, 6 people, ₱30/hr"
async function loadConfig() {
  const r = await (await fetch(API_URL)).json();
  if (!r.ok) throw new Error(r.error || 'Could not load settings');

  cats = r.categories;
  const catOptions = cats.map((c, i) =>
    `<option value="${i}">${esc(c.name)}, ${esc(c.groupSize)} people, ₱${esc(c.rate)}/hr</option>`).join('');

  $('category').innerHTML = catOptions;
  $('wCategory').innerHTML = catOptions;
  syncGroupSize();
}

// When a choice is picked, fill in its group size (staff can still change it)
function syncGroupSize() {
  const a = cats[$('category').value];
  const b = cats[$('wCategory').value];
  if (a) $('groupSize').value = a.groupSize;
  if (b) $('wGroup').value = b.groupSize;
}

// ---- Guest tap ----
async function runTap() {
  show('tap');
  const status = $('tapResult');
  const r = await post({ action: 'tap', token });

  if (!r.ok) {
    setStatus(status, r.error, 'err');
  } else if (r.action === 'choose') {
    setStatus(status, 'Welcome ' + r.name + '. Choose your room to check in.');
    await loadConfig();
    $('walkin').hidden = false;
  } else if (r.action === 'in') {
    setStatus(status, 'Checked IN at ' + r.time, 'in');
  } else {
    setStatus(status, 'Checked OUT at ' + r.time + '\n' + r.hours + ' hr  |  ₱' + r.total, 'out');
  }
}

$('wStart').onclick = async () => {
  const btn = $('wStart');
  const c = cats[$('wCategory').value];
  btn.disabled = true;
  try {
    const r = await post({
      action: 'walkin',
      token,
      category: c.name,
      purpose: $('wPurpose').value,
      groupSize: $('wGroup').value
    });
    if (!r.ok) throw new Error(r.error);
    $('walkin').hidden = true;
    setStatus($('tapResult'), 'Checked IN at ' + r.time + '\n' + c.name, 'in');
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false;
  }
};

// ---- Staff: make NFC card ----
$('mkToken').onclick = async () => {
  const name = $('cardName').value.trim();
  if (!name) return alert('Enter the guest name first');
  try {
    const r = await post({ action: 'newToken', name });
    if (!r.ok) throw new Error(r.error);
    $('cardToken').textContent = r.token;
    $('cardUrl').textContent = r.url;
    $('cardResult').hidden = false;
    $('cardName').value = '';
  } catch (e) {
    alert(e.message);
  }
};

// ---- Staff: booking form ----
$('openTime').onchange = e => { $('timeIn').disabled = e.target.checked; };
$('category').onchange = syncGroupSize;
$('wCategory').onchange = syncGroupSize;

$('form').onsubmit = async e => {
  e.preventDefault();
  const btn = $('save');
  const msg = $('msg');
  const c = cats[$('category').value];
  btn.disabled = true;
  try {
    const r = await post({
      action: 'visit',
      name: $('name').value,
      date: $('date').value,
      purpose: $('purpose').value,
      timeIn: $('openTime').checked ? 'Open' : $('timeIn').value,
      timeOut: $('timeOut').value,
      category: c.name,
      groupSize: $('groupSize').value
    });
    if (!r.ok) throw new Error(r.error);
    msg.className = 'msg ok';
    msg.textContent = 'Booking saved!';
    e.target.reset();
    $('timeIn').disabled = false;
    syncGroupSize();
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
};

// ---- Start ----
async function init() {
  if (mode === 'tap') return runTap();
  if (mode === 'admin') return show('cards');
  show('booking');
  await loadConfig();
}

init().catch(e => fail(e.message));
</script>
</body>
</html>
